<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VidRE">
<title>Video Reverse Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #c8f04a;
    --accent-dim: rgba(200,240,74,0.12);
    --accent-border: rgba(200,240,74,0.3);
    --red: #ff6b6b;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 80px;
  }

  /* Header */
  header {
    width: 100%;
    max-width: 680px;
    padding: 2.5rem 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: fadeUp 0.5s ease both;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-box {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-box svg { width: 20px; height: 20px; }

  h1 {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    border: 1px solid var(--accent-border);
    background: var(--accent-dim);
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.05em;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    font-family: var(--mono);
    padding-left: 46px;
  }

  /* Main */
  main {
    width: 100%;
    max-width: 680px;
    padding: 0 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    animation: fadeUp 0.5s ease both;
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }

  .field-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 8px;
  }

  .platform-row {
    display: flex;
    gap: 6px;
    margin-bottom: 1rem;
  }

  .plat-btn {
    flex: 1;
    padding: 8px 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    letter-spacing: 0.04em;
  }

  .plat-btn:hover { border-color: var(--border2); color: var(--text); }
  .plat-btn.active { border-color: var(--accent-border); background: var(--accent-dim); color: var(--accent); }

  input[type="text"], input[type="url"], textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  input[type="text"]:focus, input[type="url"]:focus, textarea:focus, select:focus {
    border-color: var(--accent-border);
  }

  input::placeholder, textarea::placeholder { color: #444; }

  textarea {
    min-height: 100px;
    resize: vertical;
    line-height: 1.6;
  }

  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 1rem;
  }

  /* Extras chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
  }

  .chip {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .chip:hover { border-color: var(--border2); color: var(--text); }
  .chip.on { border-color: var(--accent-border); background: var(--accent-dim); color: var(--accent); }

  /* Run button */
  .run-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #0a0a0a;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    animation: fadeUp 0.5s ease 0.2s both;
  }

  .run-btn:hover { opacity: 0.88; }
  .run-btn:active { transform: scale(0.98); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Loading */
  #loading {
    display: none;
    text-align: center;
    padding: 2rem 1.5rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    animation: fadeUp 0.3s ease both;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  /* Result */
  #result {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
    margin: 0 1.5rem;
  }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .result-title {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .copy-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }

  .copy-btn:hover { color: var(--text); border-color: var(--border2); }
  .copy-btn.copied { color: var(--accent); border-color: var(--accent-border); }

  #resultText {
    padding: 1.25rem;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .new-btn {
    display: block;
    width: calc(100% - 3rem);
    margin: 10px 1.5rem 0;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: none;
    letter-spacing: 0.04em;
  }

  .new-btn:hover { color: var(--text); border-color: var(--border2); }

  /* Error */
  .error-msg {
    background: rgba(255,107,107,0.08);
    border: 1px solid rgba(255,107,107,0.2);
    border-radius: 10px;
    padding: 12px 1rem;
    color: var(--red);
    font-family: var(--mono);
    font-size: 12px;
    margin: 0 1.5rem;
    display: none;
  }

  /* Install banner */
  #installBanner {
    display: none;
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 12px 16px;
    width: calc(100% - 32px);
    max-width: 400px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 100;
  }

  #installBanner p { font-size: 13px; flex: 1; color: var(--text); }
  #installBanner span { font-size: 11px; color: var(--muted); display: block; font-family: var(--mono); }

  .install-btn {
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--accent);
    color: #0a0a0a;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }

  .dismiss-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 4px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 480px) {
    header { padding: 2rem 1rem 0.75rem; }
    main { padding: 0 1rem; }
    #result { margin: 0 1rem; }
    .error-msg { margin: 0 1rem; }
    .new-btn { width: calc(100% - 2rem); margin: 10px 1rem 0; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="logo-box">
      <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 4C3 3.44772 3.44772 3 4 3H16C16.5523 3 17 3.44772 17 4V13C17 13.5523 16.5523 14 16 14H4C3.44772 14 3 13.5523 3 13V4Z" fill="#0a0a0a"/>
        <path d="M8 7.5L12.5 10L8 12.5V7.5Z" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M7 17H13" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M10 14V17" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Video Reverse Engineer</h1>
    <span class="badge">AI-POWERED</span>
  </div>
  <p class="subtitle">YouTube &amp; TikTok → full recreation prompt</p>
</header>

<main>

  <div class="card">
    <span class="field-label">Platform</span>
    <div class="platform-row">
      <button class="plat-btn active" onclick="setPlatform(this,'youtube')">▶ YouTube</button>
      <button class="plat-btn" onclick="setPlatform(this,'tiktok')">♪ TikTok</button>
      <button class="plat-btn" onclick="setPlatform(this,'reels')">◉ Reels</button>
      <button class="plat-btn" onclick="setPlatform(this,'other')">··· Other</button>
    </div>

    <span class="field-label">Video link</span>
    <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=... or tiktok.com/@..." style="margin-bottom:1rem;">

    <span class="field-label">Describe what you see in the video</span>
    <textarea id="description" placeholder="e.g. Faceless cooking video, fast cuts, lo-fi music, no voiceover. Shows a pasta recipe in 60 seconds. Dark moody kitchen. Text overlays for each step. Ends with 'follow for more recipes'."></textarea>
  </div>

  <div class="card">
    <span class="field-label">Analysis depth</span>
    <select id="depth">
      <option value="full">Full analysis — all sections</option>
      <option value="quick">Quick — recreation prompt only</option>
      <option value="script">Script &amp; narration focus</option>
      <option value="visual">Visual &amp; editing style focus</option>
    </select>

    <div style="margin-top:1rem;">
      <span class="field-label">Include in output</span>
      <div class="chips">
        <button class="chip on" onclick="toggleChip(this,'hook')">Hook breakdown</button>
        <button class="chip on" onclick="toggleChip(this,'cta')">CTA analysis</button>
        <button class="chip" onclick="toggleChip(this,'music')">Music &amp; audio</button>
        <button class="chip" onclick="toggleChip(this,'broll')">B-roll list</button>
        <button class="chip" onclick="toggleChip(this,'captions')">Caption style</button>
        <button class="chip" onclick="toggleChip(this,'niche')">Niche &amp; audience</button>
        <button class="chip" onclick="toggleChip(this,'thumbnail')">Thumbnail tips</button>
        <button class="chip" onclick="toggleChip(this,'hashtags')">Hashtag strategy</button>
      </div>
    </div>
  </div>

  <button class="run-btn" onclick="analyze()" id="runBtn">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 2.5L13.5 8L3 13.5V2.5Z" fill="currentColor"/></svg>
    Reverse engineer this video
  </button>

</main>

<div id="loading">
  <div class="spinner"></div>
  Analyzing video pattern...
</div>

<div id="errorMsg" class="error-msg"></div>

<div id="result">
  <div class="result-header">
    <span class="result-title">⚡ Recreation Prompt</span>
    <button class="copy-btn" id="copyBtn" onclick="copyResult()">Copy all</button>
  </div>
  <div id="resultText"></div>
</div>

<button class="new-btn" id="newBtn" onclick="reset()">↩ Analyze another video</button>

<script>
let selectedPlatform = 'youtube';
const selectedExtras = new Set(['hook', 'cta']);

function setPlatform(btn, val) {
  selectedPlatform = val;
  document.querySelectorAll('.plat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleChip(btn, key) {
  if (selectedExtras.has(key)) {
    selectedExtras.delete(key);
    btn.classList.remove('on');
  } else {
    selectedExtras.add(key);
    btn.classList.add('on');
  }
}

function copyResult() {
  const text = document.getElementById('resultText').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy all'; btn.classList.remove('copied'); }, 2000);
  });
}

function reset() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('newBtn').style.display = 'none';
  document.getElementById('runBtn').style.display = 'flex';
  document.getElementById('videoUrl').value = '';
  document.getElementById('description').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function analyze() {
  const url = document.getElementById('videoUrl').value.trim();
  const desc = document.getElementById('description').value.trim();
  const depth = document.getElementById('depth').value;

  if (!url && !desc) {
    const err = document.getElementById('errorMsg');
    err.textContent = 'Please paste the video link and/or describe the video.';
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 3000);
    return;
  }

  document.getElementById('runBtn').disabled = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('newBtn').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('errorMsg').style.display = 'none';

  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  const depthMap = {
    full: 'Provide a comprehensive full analysis with all sections.',
    quick: 'Provide only the final RECREATION PROMPT block — skip the detailed breakdown sections.',
    script: 'Focus deeply on script, narration, hook phrasing, and spoken content structure. Include all other sections briefly.',
    visual: 'Focus deeply on visual style, editing pace, color grading, transitions, text overlays. Include other sections briefly.'
  };

  const extrasNote = selectedExtras.size
    ? `Make sure to include detailed subsections for: ${[...selectedExtras].join(', ')}.`
    : '';

  const platformLabel = { youtube: 'YouTube', tiktok: 'TikTok', reels: 'Instagram Reels', other: 'video' }[selectedPlatform];

  const systemPrompt = `You are an expert video content strategist and creative director who reverse engineers viral ${platformLabel} videos into detailed, actionable recreation prompts.`;

  const userPrompt = `Reverse engineer this ${platformLabel} video and produce a structured recreation guide.

VIDEO LINK: ${url || '(not provided)'}

DESCRIPTION:
${desc || '(infer from context)'}

OUTPUT STRUCTURE — use these exact section headers:

**1. HOOK ANALYSIS** — First 3 seconds: visual or spoken opener, what makes it stop-scroll

**2. CONTENT FORMAT** — Talking head / faceless / tutorial / POV / storytime / listicle / etc.

**3. SCRIPT & NARRATION** — Tone, pacing, sentence length, vocabulary level, energy

**4. VISUAL STYLE** — Aesthetic, color grading, lighting, text overlays, fonts used

**5. EDITING PACE** — Cut frequency, transitions, speed ramps, effects

**6. AUDIO** — Music genre/mood, voiceover style, sound design

**7. VIDEO STRUCTURE** — Breakdown with approximate timestamps (e.g. 0-3s hook, 3-25s body, 25-30s CTA)

**8. RECREATION PROMPT**
A single copy-pasteable prompt block a creator can use to make this video about a different topic. Format it as a clear creative brief.

${depthMap[depth]}
${extrasNote}

Be specific and actionable. Avoid vague descriptions.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    const data = await response.json();

    if (data.error) throw new Error(data.error.message);

    const text = data.content.map(b => b.text || '').join('\n').trim();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('resultText').innerText = text;
    document.getElementById('result').style.display = 'block';
    document.getElementById('newBtn').style.display = 'block';
    document.getElementById('runBtn').disabled = false;
    document.getElementById('runBtn').style.display = 'none';

    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('runBtn').disabled = false;
    const errEl = document.getElementById('errorMsg');
    errEl.textContent = 'Error: ' + (err.message || 'Something went wrong. Try again.');
    errEl.style.display = 'block';
  }
}

// PWA install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('installBanner');
  if (banner) banner.style.display = 'flex';
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBanner').style.display = 'none';
    });
  }
}
</script>

<!-- Install banner (shown only on supported browsers) -->
<div id="installBanner" style="display:none; position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border2); border-radius:14px; padding:12px 16px; width:calc(100% - 32px); max-width:400px; align-items:center; gap:10px; box-shadow:0 8px 32px rgba(0,0,0,0.5); z-index:100;">
  <div style="flex:1;">
    <p style="font-size:13px; color:var(--text); margin-bottom:2px;">Add to Home Screen</p>
    <span style="font-size:11px; color:var(--muted); font-family:var(--mono);">Use as a standalone app</span>
  </div>
  <button class="install-btn" onclick="installApp()">Install</button>
  <button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px;" onclick="this.parentElement.style.display='none'">×</button>
</div>

</body>
</html>
